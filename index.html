<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኢሎጎስ - የመስመር ላይ ፈተና መድረክ | Online Exam Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Admin Panel */
        .admin-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-outline { background: transparent; border: 2px solid #667eea; color: #667eea; }

        .btn-primary:hover, .btn-danger:hover, .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Course Grid */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .course-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .course-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
        }

        .course-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .course-info {
            color: rgba(255,255,255,0.7);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .course-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .stat {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #667eea;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1f3a, #0f1329);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .modal-large {
            max-width: 800px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 1.3rem;
            font-weight: 700;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .close-modal {
            cursor: pointer;
            font-size: 1.8rem;
            transition: transform 0.3s;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
        }

        .form-group input, 
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        /* Question Item */
        .question-item {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        /* Exam Portal */
        .exam-container {
            background: linear-gradient(135deg, #1a1f3a, #0f1329);
            border-radius: 20px;
            padding: 30px;
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            flex-wrap: wrap;
            gap: 15px;
        }

        .timer-box {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .question-box {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover {
            background: rgba(102,126,234,0.2);
        }

        .option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .option label {
            flex: 1;
            cursor: pointer;
            font-size: 1rem;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .courses-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-church"></i> ኢሎጎስ</h1>
            <p>የመስመር ላይ የነገረ መለኮት ፈተና መድረክ | Online Theological Exam Platform</p>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="admin-panel" style="display: none;">
            <div>
                <i class="fas fa-user-circle"></i> <strong id="adminName"></strong> (አስተዳዳሪ)
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="showCreateCourseModal()"><i class="fas fa-plus"></i> አዲስ ኮርስ</button>
                <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> ውጣ</button>
            </div>
        </div>

        <!-- Login Button -->
        <div id="loginSection" style="text-align: center; margin-bottom: 30px;">
            <button class="btn btn-primary" onclick="login()" style="font-size: 1.1rem;"><i class="fab fa-google"></i> የአስተዳዳሪ መግቢያ</button>
        </div>

        <!-- Courses Grid -->
        <h2 style="margin-bottom: 20px;"><i class="fas fa-book"></i> የትምህርት ኮርሶች</h2>
        <div id="coursesGrid" class="courses-grid"></div>
    </div>

    <!-- Create Course Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <span><i class="fas fa-plus-circle"></i> አዲስ ኮርስ መፍጠር</span>
                <span class="close-modal" onclick="closeCourseModal()">&times;</span>
            </div>
            <form id="courseForm">
                <div class="form-group">
                    <label>የኮርስ ስም</label>
                    <input type="text" id="courseName" required placeholder="ለምሳሌ: ኢሳይያስ ትንበያ">
                </div>
                <div class="form-group">
                    <label>መግለጫ</label>
                    <textarea id="courseDesc" rows="2" placeholder="ስለ ኮርሱ አጭር መግለጫ"></textarea>
                </div>
                <div class="form-group">
                    <label>የፈተና ጊዜ (በሰከንዶች)</label>
                    <input type="number" id="examTime" value="1800" placeholder="ለምሳሌ: 1800 = 30 ደቂቃ">
                    <small>ለፈጣን ፈተና 600 (10 ደቂቃ), ለመጨረሻ ፈተና 3600 (60 ደቂቃ)</small>
                </div>
                <h3 style="margin: 20px 0 15px;"><i class="fas fa-question-circle"></i> ጥያቄዎች ማከል</h3>
                <div id="questionsContainer"></div>
                <button type="button" class="btn btn-outline" onclick="addQuestionField()" style="width: 100%; margin-bottom: 15px;">
                    <i class="fas fa-plus"></i> ሌላ ጥያቄ ያክሉ
                </button>
                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-save"></i> ኮርሱን አስቀምጥ</button>
            </form>
        </div>
    </div>

    <!-- Exam Portal Modal -->
    <div id="examModal" class="modal"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9fyVRq3PvE4c9e_w_Aeia773dz-PO4dg",
            authDomain: "elogos-theological-platform.firebaseapp.com",
            projectId: "elogos-theological-platform",
            storageBucket: "elogos-theological-platform.firebasestorage.app",
            messagingSenderId: "351987877452",
            appId: "1:351987877452:web:b16a3828b9c12d3057d6e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let currentExamData = null;

        window.login = () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert("Error: " + err.message));
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const adminPanel = document.getElementById('adminPanel');
            const loginSection = document.getElementById('loginSection');
            
            if (user) {
                adminPanel.style.display = 'flex';
                loginSection.style.display = 'none';
                document.getElementById('adminName').innerHTML = user.displayName || user.email;
            } else {
                adminPanel.style.display = 'none';
                loginSection.style.display = 'block';
            }
            loadCourses();
        });

        async function loadCourses() {
            const coursesSnapshot = await getDocs(collection(db, "courses"));
            const coursesGrid = document.getElementById('coursesGrid');
            
            if (coursesSnapshot.empty) {
                coursesGrid.innerHTML = '<div style="text-align: center; grid-column: 1/-1; padding: 50px; background: rgba(255,255,255,0.05); border-radius: 20px;">📚 ምንም ኮርሶች የሉም። እባክዎ አስተዳዳሪው ኮርሶችን ይጨምሩ</div>';
                return;
            }
            
            coursesGrid.innerHTML = '';
            for (const courseDoc of coursesSnapshot.docs) {
                const course = { id: courseDoc.id, ...courseDoc.data() };
                const questionsSnapshot = await getDocs(collection(db, "questions"));
                const courseQuestions = questionsSnapshot.docs.filter(q => q.data().courseId === course.id);
                const questionCount = courseQuestions.length;
                
                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <div class="course-title">📖 ${escapeHtml(course.name)}</div>
                    <div class="course-info">${escapeHtml(course.description || 'የነገረ መለኮት ኮርስ')}</div>
                    <div class="course-stats">
                        <div class="stat"><div class="stat-value">${questionCount}</div><div>ጥያቄዎች</div></div>
                        <div class="stat"><div class="stat-value">${course.examTime || 1800}s</div><div>የፈተና ጊዜ</div></div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-primary" onclick="startExam('${course.id}', '${escapeHtml(course.name)}', 'quiz', ${course.examTime || 600})"><i class="fas fa-bolt"></i> ፈጣን ፈተና</button>
                        <button class="btn btn-danger" onclick="startExam('${course.id}', '${escapeHtml(course.name)}', 'exam', ${course.examTime || 1800})"><i class="fas fa-trophy"></i> የመጨረሻ ፈተና</button>
                    </div>
                    ${currentUser ? `<button class="btn btn-outline" style="width: 100%; margin-top: 10px;" onclick="deleteCourse('${course.id}')"><i class="fas fa-trash"></i> ኮርሱን ሰርዝ</button>` : ''}
                `;
                coursesGrid.appendChild(card);
            }
        }

        window.startExam = async (courseId, courseName, examType, timeLimit) => {
            const questionsSnapshot = await getDocs(collection(db, "questions"));
            let questions = [];
            questionsSnapshot.forEach(doc => {
                const q = doc.data();
                if (q.courseId === courseId) {
                    questions.push({ id: doc.id, ...q });
                }
            });
            
            if (questions.length === 0) {
                alert('ለዚህ ኮርስ ምንም ጥያቄዎች የሉም! እባክዎ አስተዳዳሪው ጥያቄዎችን ይጨምሩ');
                return;
            }
            
            if (examType === 'quiz' && questions.length > 10) {
                questions = shuffleArray(questions).slice(0, 10);
            }
            
            currentExamData = { courseId, courseName, examType, questions, timeLimit };
            showStudentInfoModal();
        };

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function showStudentInfoModal() {
            const modal = document.getElementById('examModal');
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <span><i class="fas fa-user-graduate"></i> የተማሪ መረጃ</span>
                        <span class="close-modal" onclick="closeExamModal()">&times;</span>
                    </div>
                    <form id="studentInfoForm">
                        <div class="form-group">
                            <label>ሙሉ ስም / Full Name</label>
                            <input type="text" id="studentName" required placeholder="ሙሉ ስምዎን ያስገቡ">
                        </div>
                        <div class="form-group">
                            <label>ስልክ ቁጥር / Mobile Number</label>
                            <input type="tel" id="studentMobile" required placeholder="09XXXXXXXX">
                        </div>
                        <div class="form-group">
                            <label>ኮሌጅ / College (ካለ)</label>
                            <input type="text" id="studentCollege" placeholder="የኮሌጅ ስም">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-play"></i> ፈተና ጀምር</button>
                    </form>
                </div>
            `;
            modal.style.display = 'flex';
            
            document.getElementById('studentInfoForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const studentName = document.getElementById('studentName').value;
                const studentMobile = document.getElementById('studentMobile').value;
                const studentCollege = document.getElementById('studentCollege').value;
                
                if (!studentName || !studentMobile) {
                    alert('እባክዎ ስም እና ስልክ ቁጥር ያስገቡ');
                    return;
                }
                
                closeExamModal();
                runExam(studentName, studentMobile, studentCollege);
            });
        }

        function runExam(studentName, studentMobile, studentCollege) {
            let currentIndex = 0;
            let answers = new Array(currentExamData.questions.length).fill(null);
            let timeLeft = currentExamData.timeLimit;
            let timerInterval;
            
            function renderExam() {
                const q = currentExamData.questions[currentIndex];
                const modal = document.getElementById('examModal');
                
                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx);
                    optionsHtml += `
                        <div class="option" onclick="document.getElementById('q${currentIndex}_${letter}').click()">
                            <input type="radio" name="q${currentIndex}" id="q${currentIndex}_${letter}" value="${letter}" ${answers[currentIndex] === letter ? 'checked' : ''} onchange="selectAnswer(${currentIndex}, '${letter}')">
                            <label for="q${currentIndex}_${letter}"><strong>${letter}.</strong> ${escapeHtml(opt)}</label>
                        </div>
                    `;
                });
                
                modal.innerHTML = `
                    <div class="exam-container">
                        <div class="exam-header">
                            <div>
                                <h3>${escapeHtml(currentExamData.courseName)}</h3>
                                <small>${studentName} | ${studentMobile}</small>
                                <div>${currentExamData.examType === 'quiz' ? 'ፈጣን ፈተና' : 'የመጨረሻ ፈተና'}</div>
                            </div>
                            <div class="timer-box" id="timerDisplay">
                                <i class="fas fa-hourglass-half"></i> ${formatTime(timeLeft)}
                            </div>
                        </div>
                        
                        <div class="question-box">
                            <div class="question-text">
                                <strong>ጥያቄ ${currentIndex + 1}/${currentExamData.questions.length}</strong><br>
                                ${escapeHtml(q.text)}
                            </div>
                            <div class="options">
                                ${optionsHtml}
                            </div>
                        </div>
                        
                        <div class="nav-buttons">
                            <button class="btn btn-outline" onclick="changeQuestion(-1)" ${currentIndex === 0 ? 'disabled' : ''}>◀ ቀዳሚ</button>
                            <span style="padding: 10px;">${currentIndex + 1} / ${currentExamData.questions.length}</span>
                            <button class="btn btn-primary" onclick="changeQuestion(1)">ቀጥል ▶</button>
                        </div>
                        
                        <button class="btn submit-btn" onclick="submitExam()">
                            <i class="fas fa-paper-plane"></i> ፈተናውን አስገባ
                        </button>
                    </div>
                `;
                modal.style.display = 'flex';
            }
            
            window.selectAnswer = (idx, letter) => {
                answers[idx] = letter;
            };
            
            window.changeQuestion = (delta) => {
                const newIndex = currentIndex + delta;
                if (newIndex >= 0 && newIndex < currentExamData.questions.length) {
                    currentIndex = newIndex;
                    renderExam();
                }
            };
            
            window.submitExam = () => {
                const unanswered = answers.some(a => a === null);
                if (unanswered) {
                    if (!confirm('አንዳንድ ጥያቄዎች መልስ አላገኙም! ፈተናውን ማስገባት ይፈልጋሉ?')) {
                        return;
                    }
                }
                
                clearInterval(timerInterval);
                
                let score = 0;
                currentExamData.questions.forEach((q, idx) => {
                    if (answers[idx] === q.correct) score++;
                });
                const percentage = (score / currentExamData.questions.length) * 100;
                
                // Save result
                addDoc(collection(db, "results"), {
                    studentName, studentMobile, studentCollege,
                    courseId: currentExamData.courseId,
                    courseName: currentExamData.courseName,
                    examType: currentExamData.examType,
                    score, total: currentExamData.questions.length,
                    percentage,
                    timeSpent: currentExamData.timeLimit - timeLeft,
                    date: new Date()
                });
                
                let grade = percentage >= 80 ? 'የላቀ (Excellent)' : percentage >= 60 ? 'ጥሩ (Good)' : percentage >= 40 ? 'አማካይ (Average)' : 'ዳግም ፈተና ያስፈልጋል (Need Improvement)';
                
                const modal = document.getElementById('examModal');
                modal.innerHTML = `
                    <div class="exam-container" style="text-align: center;">
                        <i class="fas fa-check-circle" style="font-size: 4rem; color: #28a745; margin-bottom: 20px;"></i>
                        <h2>ፈተና ተጠናቋል!</h2>
                        <h3>${escapeHtml(currentExamData.courseName)}</h3>
                        <p>${studentName} | ${studentMobile}</p>
                        <div style="font-size: 3rem; margin: 20px 0;">${score}/${currentExamData.questions.length}</div>
                        <div style="font-size: 1.5rem;">${percentage.toFixed(1)}%</div>
                        <div style="margin: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px;">${grade}</div>
                        <button class="btn btn-primary" onclick="closeExamModal()">ዝጋ</button>
                    </div>
                `;
            };
            
            function startTimer() {
                timerInterval = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        alert('ጊዜው አልቋል! ፈተናው በራስ ይሰረዛል');
                        submitExam();
                    } else {
                        timeLeft--;
                        const timerDisplay = document.getElementById('timerDisplay');
                        if (timerDisplay) {
                            timerDisplay.innerHTML = `<i class="fas fa-hourglass-half"></i> ${formatTime(timeLeft)}`;
                        }
                        if (timeLeft <= 60) {
                            timerDisplay.style.background = '#dc3545';
                            timerDisplay.style.animation = 'pulse 1s infinite';
                        }
                    }
                }, 1000);
            }
            
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            }
            
            renderExam();
            startTimer();
        }

        window.closeExamModal = () => {
            const modal = document.getElementById('examModal');
            modal.style.display = 'none';
            modal.innerHTML = '';
            if (currentExamData) location.reload();
        };

        // Admin Functions
        window.showCreateCourseModal = () => {
            document.getElementById('questionsContainer').innerHTML = '';
            addQuestionField();
            document.getElementById('courseModal').style.display = 'flex';
        };

        window.closeCourseModal = () => {
            document.getElementById('courseModal').style.display = 'none';
            document.getElementById('courseForm').reset();
        };

        window.addQuestionField = () => {
            const container = document.getElementById('questionsContainer');
            const qDiv = document.createElement('div');
            qDiv.className = 'question-item';
            qDiv.innerHTML = `
                <div class="form-group"><label>ጥያቄ</label><textarea class="q-text" rows="2" required placeholder="ጥያቄውን ያስገቡ"></textarea></div>
                <div class="form-group"><label>አማራጭ A</label><input class="q-opt-a" type="text" required placeholder="አማራጭ A"></div>
                <div class="form-group"><label>አማራጭ B</label><input class="q-opt-b" type="text" required placeholder="አማራጭ B"></div>
                <div class="form-group"><label>አማራጭ C</label><input class="q-opt-c" type="text" required placeholder="አማራጭ C"></div>
                <div class="form-group"><label>አማራጭ D</label><input class="q-opt-d" type="text" required placeholder="አማራጭ D"></div>
                <div class="form-group"><label>ትክክለኛ መልስ</label>
                    <select class="q-correct">
                        <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
                    </select>
                </div>
                <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()" style="margin-top: 10px; width: 100%;">ሰርዝ</button>
            `;
            container.appendChild(qDiv);
        };

        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('courseName').value;
            const description = document.getElementById('courseDesc').value;
            const examTime = parseInt(document.getElementById('examTime').value);
            
            const courseRef = await addDoc(collection(db, "courses"), { name, description, examTime });
            
            const questionItems = document.querySelectorAll('.question-item');
            for (const item of questionItems) {
                const text = item.querySelector('.q-text').value;
                const optA = item.querySelector('.q-opt-a').value;
                const optB = item.querySelector('.q-opt-b').value;
                const optC = item.querySelector('.q-opt-c').value;
                const optD = item.querySelector('.q-opt-d').value;
                const correct = item.querySelector('.q-correct').value;
                
                if (text && optA && optB && optC && optD) {
                    await addDoc(collection(db, "questions"), {
                        courseId: courseRef.id,
                        text, options: [optA, optB, optC, optD], correct
                    });
                }
            }
            
            alert('ኮርስ በሚገባ ተፈጥሯል!');
            closeCourseModal();
            loadCourses();
        });

        window.deleteCourse = async (courseId) => {
            if (confirm('ኮርሱን ለመሰረዝ እንወስናለን? ሁሉም ጥያቄዎች ይወገዳሉ!')) {
                const questions = await getDocs(collection(db, "questions"));
                for (const q of questions.docs) {
                    if (q.data().courseId === courseId) {
                        await deleteDoc(doc(db, "questions", q.id));
                    }
                }
                await deleteDoc(doc(db, "courses", courseId));
                alert('ኮርሱ ተሰርዟል');
                loadCourses();
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
