<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኢሎጎስ - የነገረ መለኮት ፈተና መድረክ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1329 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .hero p {
            color: rgba(255,255,255,0.7);
            font-size: 1.2rem;
        }

        .admin-bar {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .course-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .course-card:hover {
            transform: translateY(-5px);
            border-color: #667eea;
        }

        .course-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: white;
        }

        .course-desc {
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .question-count {
            display: inline-block;
            background: rgba(102,126,234,0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .button-group button {
            flex: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1a1f3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-modal {
            cursor: pointer;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: rgba(255,255,255,0.8);
        }

        .form-group input, 
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            font-family: 'Montserrat', sans-serif;
        }

        .quiz-container {
            background: #1a1f3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .option {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover {
            background: rgba(102,126,234,0.2);
        }

        .option.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .courses-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>ኢሎጎስ</h1>
            <p>የነገረ መለኮት ፈተና መድረክ</p>
        </div>

        <div id="adminPanel" class="admin-bar" style="display: none;">
            <div><strong id="adminName"></strong> (አስተዳዳሪ)</div>
            <div>
                <button class="btn btn-primary" onclick="showAddCourseModal()">+ አዲስ ኮርስ</button>
                <button class="btn btn-danger" onclick="logout()">ውጣ</button>
            </div>
        </div>

        <div id="loginSection" style="text-align: center; margin-bottom: 30px;">
            <button class="btn btn-primary" onclick="login()"><i class="fab fa-google"></i> የአስተዳዳሪ መግቢያ</button>
        </div>

        <div id="coursesGrid" class="courses-grid"></div>
    </div>

    <!-- Student Info Modal -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>📝 የተማሪ መረጃ</span>
                <span class="close-modal" onclick="closeStudentModal()">&times;</span>
            </div>
            <form id="studentForm">
                <div class="form-group">
                    <label>ሙሉ ስም</label>
                    <input type="text" id="studentName" required>
                </div>
                <div class="form-group">
                    <label>ስልክ ቁጥር</label>
                    <input type="tel" id="studentMobile" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">ጀምር</button>
            </form>
        </div>
    </div>

    <!-- Add Course Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>📚 አዲስ ኮርስ</span>
                <span class="close-modal" onclick="closeCourseModal()">&times;</span>
            </div>
            <form id="courseForm">
                <div class="form-group">
                    <label>የኮርስ ስም</label>
                    <input type="text" id="courseName" required>
                </div>
                <div class="form-group">
                    <label>መግለጫ</label>
                    <textarea id="courseDesc" rows="2"></textarea>
                </div>
                <h4>ጥያቄዎች</h4>
                <div id="questionsContainer">
                    <div class="question-item" style="margin-bottom: 15px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px;">
                        <input type="text" class="q-text" placeholder="ጥያቄ" style="width: 100%; margin-bottom: 10px;">
                        <input type="text" class="q-opt-a" placeholder="አማራጭ A" style="width: 100%; margin-bottom: 5px;">
                        <input type="text" class="q-opt-b" placeholder="አማራጭ B" style="width: 100%; margin-bottom: 5px;">
                        <input type="text" class="q-opt-c" placeholder="አማራጭ C" style="width: 100%; margin-bottom: 5px;">
                        <input type="text" class="q-opt-d" placeholder="አማራጭ D" style="width: 100%; margin-bottom: 5px;">
                        <select class="q-correct" style="width: 100%; padding: 8px;">
                            <option value="A">ትክክለኛ መልስ: A</option>
                            <option value="B">ትክክለኛ መልስ: B</option>
                            <option value="C">ትክክለኛ መልስ: C</option>
                            <option value="D">ትክክለኛ መልስ: D</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="btn btn-outline" onclick="addQuestion()" style="width: 100%; margin-bottom: 10px;">+ ሌላ ጥያቄ</button>
                <button type="submit" class="btn btn-primary" style="width: 100%;">ኮርሱን አስቀምጥ</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9fyVRq3PvE4c9e_w_Aeia773dz-PO4dg",
            authDomain: "elogos-theological-platform.firebaseapp.com",
            projectId: "elogos-theological-platform",
            storageBucket: "elogos-theological-platform.firebasestorage.app",
            messagingSenderId: "351987877452",
            appId: "1:351987877452:web:b16a3828b9c12d3057d6e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let currentCourse = null;
        let currentExamType = null;

        window.login = () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert("Error: " + err.message));
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const adminPanel = document.getElementById('adminPanel');
            const loginSection = document.getElementById('loginSection');
            
            if (user) {
                adminPanel.style.display = 'flex';
                loginSection.style.display = 'none';
                document.getElementById('adminName').innerHTML = user.displayName || user.email;
            } else {
                adminPanel.style.display = 'none';
                loginSection.style.display = 'block';
            }
            loadCourses();
        });

        async function loadCourses() {
            const coursesSnapshot = await getDocs(collection(db, "courses"));
            const coursesGrid = document.getElementById('coursesGrid');
            
            if (coursesSnapshot.empty) {
                coursesGrid.innerHTML = '<div style="text-align: center; grid-column: 1/-1; padding: 50px; background: rgba(255,255,255,0.05); border-radius: 20px;">📖 ምንም ኮርሶች የሉም</div>';
                return;
            }
            
            coursesGrid.innerHTML = '';
            for (const courseDoc of coursesSnapshot.docs) {
                const course = { id: courseDoc.id, ...courseDoc.data() };
                const questionsSnapshot = await getDocs(collection(db, "questions"));
                const courseQuestions = questionsSnapshot.docs.filter(q => q.data().courseId === course.id);
                const questionCount = courseQuestions.length;
                
                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <div class="course-title">${escapeHtml(course.name)}</div>
                    <div class="course-desc">${escapeHtml(course.description || 'በዚህ ኮርስ ውስጥ ያሉ ጥያቄዎች ከዚህ በታች ባሉት አዝራሮች ይገኛሉ')}</div>
                    <div class="question-count"><i class="fas fa-question-circle"></i> ${questionCount} ጥያቄዎች</div>
                    <div class="button-group">
                        <button class="btn btn-primary" onclick="startExam('${course.id}', '${escapeHtml(course.name)}', 'quiz')"><i class="fas fa-bolt"></i> ፈጣን ፈተና</button>
                        <button class="btn btn-danger" onclick="startExam('${course.id}', '${escapeHtml(course.name)}', 'exam')"><i class="fas fa-trophy"></i> የመጨረሻ ፈተና</button>
                    </div>
                    ${currentUser ? `<button class="btn btn-outline" style="width: 100%; margin-top: 10px;" onclick="deleteCourse('${course.id}')">🗑️ ኮርሱን ሰርዝ</button>` : ''}
                `;
                coursesGrid.appendChild(card);
            }
        }

        window.startExam = async (courseId, courseName, type) => {
            const questionsSnapshot = await getDocs(collection(db, "questions"));
            let allQuestions = [];
            questionsSnapshot.forEach(doc => {
                const q = doc.data();
                if (q.courseId === courseId) {
                    allQuestions.push({ id: doc.id, ...q });
                }
            });
            
            if (allQuestions.length === 0) {
                alert('ለዚህ ኮርስ ምንም ጥያቄዎች የሉም! እባክዎ አስተዳዳሪው ጥያቄዎችን ይጨምሩ');
                return;
            }
            
            if (type === 'quiz' && allQuestions.length > 5) {
                allQuestions = shuffleArray(allQuestions).slice(0, 5);
            }
            
            currentCourse = { id: courseId, name: courseName, questions: allQuestions };
            currentExamType = type;
            document.getElementById('studentModal').style.display = 'flex';
        };

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        window.closeStudentModal = () => {
            document.getElementById('studentModal').style.display = 'none';
        };

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentName = document.getElementById('studentName').value;
            const studentMobile = document.getElementById('studentMobile').value;
            
            if (!studentName || !studentMobile) {
                alert('እባክዎ ስም እና ስልክ ቁጥር ያስገቡ');
                return;
            }
            
            closeStudentModal();
            await runQuiz(studentName, studentMobile);
        });

        async function runQuiz(studentName, studentMobile) {
            let currentIndex = 0;
            let answers = new Array(currentCourse.questions.length).fill(null);
            
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';
            
            function renderQuiz() {
                const q = currentCourse.questions[currentIndex];
                modal.innerHTML = `
                    <div class="quiz-container">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                            <div><strong>${escapeHtml(currentCourse.name)}</strong><br>${studentName}</div>
                            <button class="btn btn-outline" onclick="this.closest('.modal').remove()">✕</button>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <strong>ጥያቄ ${currentIndex + 1}/${currentCourse.questions.length}</strong>
                        </div>
                        <div style="margin-bottom: 20px; font-size: 1.1rem;">
                            ${escapeHtml(q.text)}
                        </div>
                        <div>
                            ${q.options.map((opt, idx) => {
                                const letter = String.fromCharCode(65 + idx);
                                return `<div class="option ${answers[currentIndex] === letter ? 'selected' : ''}" onclick="selectAnswer(${currentIndex}, '${letter}')">
                                    <strong>${letter}.</strong> ${escapeHtml(opt)}
                                </div>`;
                            }).join('')}
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                            <button class="btn btn-outline" onclick="changeQuestion(-1)" ${currentIndex === 0 ? 'disabled' : ''}>ቀዳሚ</button>
                            <button class="btn btn-primary" onclick="changeQuestion(1)">${currentIndex === currentCourse.questions.length - 1 ? 'አስገባ' : 'ቀጥል'}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }
            
            window.selectAnswer = (idx, letter) => {
                answers[idx] = letter;
                renderQuiz();
            };
            
            window.changeQuestion = (delta) => {
                if (answers[currentIndex] === null && delta === 1) {
                    alert('እባክዎ መልስ ይምረጡ');
                    return;
                }
                const newIndex = currentIndex + delta;
                if (newIndex >= 0 && newIndex < currentCourse.questions.length) {
                    currentIndex = newIndex;
                    renderQuiz();
                } else if (newIndex === currentCourse.questions.length) {
                    finishQuiz();
                }
            };
            
            function finishQuiz() {
                let score = 0;
                currentCourse.questions.forEach((q, idx) => {
                    if (answers[idx] === q.correct) score++;
                });
                const percentage = (score / currentCourse.questions.length) * 100;
                
                // Save result
                await addDoc(collection(db, "results"), {
                    studentName, studentMobile,
                    courseName: currentCourse.name,
                    examType: currentExamType,
                    score, total: currentCourse.questions.length,
                    percentage,
                    date: new Date()
                });
                
                modal.innerHTML = `
                    <div class="quiz-container" style="text-align: center;">
                        <i class="fas fa-check-circle" style="font-size: 3rem; color: #28a745; margin-bottom: 20px;"></i>
                        <h2>ፈተና ተጠናቋል!</h2>
                        <div style="font-size: 2rem; margin: 20px 0;">${score}/${currentCourse.questions.length}</div>
                        <div style="font-size: 1.2rem;">${percentage.toFixed(1)}%</div>
                        <button class="btn btn-primary" style="margin-top: 20px;" onclick="location.reload()">ዝጋ</button>
                    </div>
                `;
            }
            
            renderQuiz();
        }

        // Admin Functions
        window.showAddCourseModal = () => {
            document.getElementById('courseModal').style.display = 'flex';
        };

        window.closeCourseModal = () => {
            document.getElementById('courseModal').style.display = 'none';
            document.getElementById('courseForm').reset();
        };

        window.addQuestion = () => {
            const container = document.getElementById('questionsContainer');
            const newDiv = document.createElement('div');
            newDiv.className = 'question-item';
            newDiv.style.marginBottom = '15px';
            newDiv.style.padding = '15px';
            newDiv.style.background = 'rgba(255,255,255,0.05)';
            newDiv.style.borderRadius = '10px';
            newDiv.innerHTML = `
                <input type="text" class="q-text" placeholder="ጥያቄ" style="width: 100%; margin-bottom: 10px;">
                <input type="text" class="q-opt-a" placeholder="አማራጭ A" style="width: 100%; margin-bottom: 5px;">
                <input type="text" class="q-opt-b" placeholder="አማራጭ B" style="width: 100%; margin-bottom: 5px;">
                <input type="text" class="q-opt-c" placeholder="አማራጭ C" style="width: 100%; margin-bottom: 5px;">
                <input type="text" class="q-opt-d" placeholder="አማራጭ D" style="width: 100%; margin-bottom: 5px;">
                <select class="q-correct" style="width: 100%; padding: 8px;">
                    <option value="A">ትክክለኛ መልስ: A</option>
                    <option value="B">ትክክለኛ መልስ: B</option>
                    <option value="C">ትክክለኛ መልስ: C</option>
                    <option value="D">ትክክለኛ መልስ: D</option>
                </select>
                <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()" style="margin-top: 10px; width: 100%;">ሰርዝ</button>
            `;
            container.appendChild(newDiv);
        };

        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('courseName').value;
            const description = document.getElementById('courseDesc').value;
            
            const courseRef = await addDoc(collection(db, "courses"), { name, description });
            
            const questionItems = document.querySelectorAll('.question-item');
            for (const item of questionItems) {
                const text = item.querySelector('.q-text').value;
                const optA = item.querySelector('.q-opt-a').value;
                const optB = item.querySelector('.q-opt-b').value;
                const optC = item.querySelector('.q-opt-c').value;
                const optD = item.querySelector('.q-opt-d').value;
                const correct = item.querySelector('.q-correct').value;
                
                if (text && optA && optB && optC && optD) {
                    await addDoc(collection(db, "questions"), {
                        courseId: courseRef.id,
                        text,
                        options: [optA, optB, optC, optD],
                        correct
                    });
                }
            }
            
            alert('ኮርስ ተጨምሯል!');
            closeCourseModal();
            loadCourses();
        });

        window.deleteCourse = async (courseId) => {
            if (confirm('ኮርሱን ለመሰረዝ እንወስናለን? ሁሉም ጥያቄዎች ይወገዳሉ!')) {
                const questions = await getDocs(collection(db, "questions"));
                for (const q of questions.docs) {
                    if (q.data().courseId === courseId) {
                        await deleteDoc(doc(db, "questions", q.id));
                    }
                }
                await deleteDoc(doc(db, "courses", courseId));
                alert('ኮርሱ ተሰርዟል');
                loadCourses();
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
