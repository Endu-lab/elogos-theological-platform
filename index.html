<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>ኢሎጎስ የነገረ መለኮት ገፅ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; border: 1px solid #ddd; text-align: center; transition: 0.3s; }
        .card:hover { box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        .btn-quiz { background: #007bff; color: white; }
        .btn-exam { background: #dc3545; color: white; }
        .hidden { display: none; }
        #admin-panel { margin-top: 40px; padding: 20px; background: #f8f9fa; border-radius: 10px; border: 2px dashed #ccc; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>ኢሎጎስ የነገረ መለኮት ገፅ</h1>
    
    <div class="grid" id="studentBoard">
        <div class="card">
            <h3>Isaiah</h3>
            <button class="btn btn-quiz" onclick="alert('Starting Isaiah Quiz...')">Quick Quiz</button>
            <button class="btn btn-exam" onclick="alert('Starting Isaiah Exam...')">Final Exam</button>
        </div>
        <div class="card">
            <h3>Apologetics</h3>
            <button class="btn btn-quiz" onclick="alert('Starting Apologetics Quiz...')">Quick Quiz</button>
            <button class="btn btn-exam" onclick="alert('Starting Apologetics Exam...')">Final Exam</button>
        </div>
    </div>

    <button id="loginBtn" class="btn" style="background:#28a745; color:white; margin-top:30px;" onclick="login()">Admin Login</button>

    <div id="admin-panel" class="hidden">
        <h3>Admin Panel: Add New Question</h3>
        <input type="text" id="qText" placeholder="Enter Question">
        <input type="text" id="qCat" placeholder="Category (e.g., Isaiah)">
        <button class="btn btn-quiz" onclick="saveQuestion()">Save to Database</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9fyVRq3PvE4c9e_w_Aeia773dz-PO4dg",
        authDomain: "elogos-theological-platform.firebaseapp.com",
        projectId: "elogos-theological-platform",
        storageBucket: "elogos-theological-platform.firebasestorage.app",
        messagingSenderId: "351987877452",
        appId: "1:351987877452:web:b16a3828b9c12d3057d6e9",
        measurementId: "G-0RB6EYXN5E"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.login = () => {
        signInWithPopup(auth, new GoogleAuthProvider()).then(() => {
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('loginBtn').classList.add('hidden');
        }).catch(err => alert("Login Error: " + err.message));
    };

    window.saveQuestion = async () => {
        const text = document.getElementById('qText').value;
        const cat = document.getElementById('qCat').value;
        if(!text || !cat) return alert("Please fill all fields!");
        
        await addDoc(collection(db, "questions"), { text, category: cat });
        alert("Question Saved!");
        document.getElementById('qText').value = "";
    };
</script>

</body>
</html>
