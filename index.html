<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኢሎጎስ - የነገረ መለኮት አካዳሚ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinema&family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1329 100%);
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-10%, -10%); }
        }

        /* Glass Effect Container */
        .glass-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 60px 20px 80px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            backdrop-filter: blur(10px);
            border-radius: 30px;
            margin-bottom: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.8s ease;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Admin Profile Card */
        .admin-profile {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.8s ease 0.1s backwards;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Buttons */
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        /* Course Cards Grid */
        .courses-section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
        }

        .course-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease backwards;
        }

        .course-card:hover {
            transform: translateY(-10px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .course-cover {
            height: 180px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .course-cover i {
            font-size: 4rem;
            color: white;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.2));
        }

        .course-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .course-content {
            padding: 25px;
        }

        .course-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .course-description {
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .course-stats {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            margin-bottom: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat {
            text-align: center;
            flex: 1;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .button-group button {
            flex: 1;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1a1f3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 1.3rem;
        }

        .close-modal {
            cursor: pointer;
            font-size: 1.5rem;
            transition: transform 0.3s;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: rgba(255,255,255,0.8);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-family: 'Montserrat', sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .courses-grid {
                grid-template-columns: 1fr;
            }
            
            .glass-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="glass-container">
        <!-- Hero Section -->
        <div class="hero">
            <h1>ኢሎጎስ</h1>
            <p>የነገረ መለኮት አካዳሚ • Theological Excellence</p>
        </div>

        <!-- Login Section -->
        <div id="loginSection" style="text-align: center; margin-bottom: 30px;">
            <button class="btn btn-primary" onclick="login()" style="font-size: 1.1rem;">
                <i class="fab fa-google"></i> የአስተዳዳሪ መግቢያ
            </button>
        </div>

        <!-- Admin Profile -->
        <div id="adminProfile" class="admin-profile" style="display: none;">
            <div class="profile-info">
                <div class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <strong id="adminName"></strong><br>
                    <small style="color: #667eea;">Administrator</small>
                </div>
            </div>
            <div>
                <button class="btn btn-outline" onclick="showAddCourseModal()">
                    <i class="fas fa-plus"></i> አዲስ ኮርስ
                </button>
                <button class="btn btn-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> ውጣ
                </button>
            </div>
        </div>

        <!-- Courses Section -->
        <div class="courses-section">
            <div class="section-title">
                <i class="fas fa-graduation-cap"></i>
                <span>የትምህርት ኮርሶች</span>
            </div>
            <div id="coursesGrid" class="courses-grid"></div>
        </div>
    </div>

    <!-- Add Course Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span><i class="fas fa-plus-circle"></i> አዲስ ኮርስ ያክሉ</span>
                <span class="close-modal" onclick="closeCourseModal()">&times;</span>
            </div>
            <form id="courseForm">
                <div class="form-group">
                    <label>የኮርስ ስም</label>
                    <input type="text" id="courseName" required placeholder="ለምሳሌ: ኢሳይያስ">
                </div>
                <div class="form-group">
                    <label>ምልክት (Icon)</label>
                    <input type="text" id="courseIcon" value="fa-book" placeholder="fa-scroll, fa-bible, etc.">
                </div>
                <div class="form-group">
                    <label>መግለጫ</label>
                    <textarea id="courseDesc" rows="3" placeholder="ስለ ኮርሱ አጭር መግለጫ..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-save"></i> አስቀምጥ
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9fyVRq3PvE4c9e_w_Aeia773dz-PO4dg",
            authDomain: "elogos-theological-platform.firebaseapp.com",
            projectId: "elogos-theological-platform",
            storageBucket: "elogos-theological-platform.firebasestorage.app",
            messagingSenderId: "351987877452",
            appId: "1:351987877452:web:b16a3828b9c12d3057d6e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;

        window.login = () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert("Login Error: " + err.message));
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const adminProfile = document.getElementById('adminProfile');
            const loginSection = document.getElementById('loginSection');
            
            if (user) {
                adminProfile.style.display = 'flex';
                loginSection.style.display = 'none';
                document.getElementById('adminName').innerHTML = user.displayName || user.email;
            } else {
                adminProfile.style.display = 'none';
                loginSection.style.display = 'block';
            }
            loadCourses();
        });

        async function loadCourses() {
            const coursesSnapshot = await getDocs(collection(db, "courses"));
            const coursesGrid = document.getElementById('coursesGrid');
            coursesGrid.innerHTML = '';
            
            for (const courseDoc of coursesSnapshot.docs) {
                const course = { id: courseDoc.id, ...courseDoc.data() };
                const questionsSnapshot = await getDocs(query(collection(db, "questions"), where("courseId", "==", course.id)));
                const questionCount = questionsSnapshot.size;
                
                const card = document.createElement('div');
                card.className = 'course-card';
                card.style.animationDelay = Math.random() * 0.5 + 's';
                card.innerHTML = `
                    <div class="course-cover">
                        <i class="fas ${course.icon || 'fa-book'}"></i>
                        <div class="course-badge">
                            <i class="fas fa-question-circle"></i> ${questionCount} ጥያቄዎች
                        </div>
                    </div>
                    <div class="course-content">
                        <h3 class="course-title">${escapeHtml(course.name)}</h3>
                        <p class="course-description">${escapeHtml(course.description || 'በዚህ ኮርስ ውስጥ ያሉ ጥያቄዎች ከዚህ በታች ባሉት አዝራሮች ይገኛሉ')}</p>
                        <div class="course-stats">
                            <div class="stat">
                                <div class="stat-number">${questionCount}</div>
                                <div class="stat-label">ጥያቄዎች</div>
                            </div>
                        </div>
                        <div class="button-group">
                            <button class="btn btn-primary" onclick="alert('ፈጣን ፈተና ለኮርሱ: ${escapeHtml(course.name)} በቅርቡ ይመጣል')">
                                <i class="fas fa-bolt"></i> ፈጣን ፈተና
                            </button>
                            <button class="btn btn-danger" onclick="alert('የመጨረሻ ፈተና ለኮርሱ: ${escapeHtml(course.name)} በቅርቡ ይገኛል')">
                                <i class="fas fa-trophy"></i> የመጨረሻ ፈተና
                            </button>
                        </div>
                        ${currentUser ? `
                            <div style="margin-top: 15px; display: flex; gap: 10px;">
                                <button class="btn btn-outline" style="flex:1; font-size:0.8rem;" onclick="alert('ጥያቄ ማከል ለኮርሱ: ${escapeHtml(course.name)}')">
                                    <i class="fas fa-plus"></i> ጥያቄ ያክሉ
                                </button>
                                <button class="btn btn-danger" style="flex:1; font-size:0.8rem;" onclick="deleteCourse('${course.id}')">
                                    <i class="fas fa-trash"></i> ኮርሱን ሰርዝ
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
                coursesGrid.appendChild(card);
            }
            
            if(coursesSnapshot.empty) {
                coursesGrid.innerHTML = '<div style="text-align: center; grid-column: 1/-1; padding: 50px; background: rgba(255,255,255,0.05); border-radius: 20px;"><i class="fas fa-info-circle"></i> ምንም ኮርሶች የሉም። አስተዳዳሪ ኮርሶችን ማከል ይችላሉ።</div>';
            }
        }

        window.showAddCourseModal = () => {
            document.getElementById('courseModal').style.display = 'flex';
        };

        window.closeCourseModal = () => {
            document.getElementById('courseModal').style.display = 'none';
            document.getElementById('courseForm').reset();
        };

        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('courseName').value;
            const icon = document.getElementById('courseIcon').value;
            const description = document.getElementById('courseDesc').value;
            
            await addDoc(collection(db, "courses"), { name, icon, description, createdAt: new Date() });
            alert('ኮርሱ ተጨምሯል!');
            closeCourseModal();
            loadCourses();
        });

        window.deleteCourse = async (courseId) => {
            if(confirm('ይህን ኮርስ ለመሰረዝ እንወስናለን? ሁሉም ጥያቄዎች ይወገዳሉ!')) {
                const questions = await getDocs(query(collection(db, "questions"), where("courseId", "==", courseId)));
                for (const q of questions.docs) {
                    await deleteDoc(doc(db, "questions", q.id));
                }
                await deleteDoc(doc(db, "courses", courseId));
                alert('ኮርሱ ተሰርዟል!');
                loadCourses();
            }
        };

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
